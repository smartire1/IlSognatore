<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin | Il Sognatore</title>

  <link href="css/style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background-color: #DEE5E3 !important;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Almendra Display', serif;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(10px);
    }

    .login-title {
      color: #1976d2;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    .form-control {
      border-radius: 10px;
      border: 2px solid #e3f2fd;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 0.2rem rgba(25, 118, 210, 0.25);
    }

    .btn-login {
      background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      color: white;
      transition: transform 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
    }

    .login-icon {
      font-size: 3rem;
      color: #1976d2;
      margin-bottom: 1rem;
    }
  </style>
</head>

<body>

  <div class="login-container text-center">
    <i class="bi bi-shield-lock login-icon"></i>
    <h2 class="login-title">Accesso Admin</h2>

    <form id="login-form">
      <input id="login-email" type="email" class="form-control" placeholder="Email" required>
      <input id="login-password" type="password" class="form-control" placeholder="Password" required>

      <button id="login-btn" type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
      </button>
    </form>

    <div id="login-message" class="mt-3 text-danger" style="display: none;"></div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase-config.js";

    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const messageEl = document.getElementById("login-message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Accesso...';
      messageEl.style.display = 'none';

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value.trim()
        });

        if (error) {
          throw error;
        }

        // Login riuscito - redirect all'admin
        window.location.href = 'admin.html';

      } catch (error) {
        console.error(error);
        messageEl.textContent = 'Credenziali non valide. Riprova.';
        messageEl.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Accedi';
      }
    });

    // Check se già loggato
    async function checkSession() {
      const { data } = await supabase.auth.getSession();
      if (data.session) {
        window.location.href = 'admin.html';
      }
    }

    checkSession();
  </script>

</body>
</html>
