<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network | Il Sognatore</title>

  <link href="css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <div class="logo-container py-4">
    <div class="container">
      <div class="d-flex align-items-center justify-content-center">
        <h1 class="brand-title me-3">Il Sognatore</h1>
        <a href="index.html">
          <img src="img/logo.png" alt="Logo" class="brand-logo">
        </a>
      </div>
    </div>
  </div>

  <div id="navbar-placeholder"></div>

  <div class="container text-center py-4">
    <div class="network-tags text-muted">
      <div>Poeta ✒️</div>
      <div>Scrittore 🖊️</div>
      <div>Songwriter 🎼</div>
    </div>
  </div>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">

        <section class="mb-4">
          <h6 class="text-uppercase text-muted mb-2">Social</h6>
          <div id="social-links"></div>
        </section>

        <section class="mb-4">
          <h6 class="text-uppercase text-muted mb-2">Progetti</h6>
          <div id="project-links"></div>
        </section>

      </div>
    </div>
  </main>

  <site-footer></site-footer>
  <script type="module" src="js/header.js"></script>
  <script type="module" src="js/footer.js"></script>

  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-placeholder").innerHTML = data;
      });
  </script>

  <script type="module" src="js/links.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
